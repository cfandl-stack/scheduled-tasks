name: COT Trading Alert

on:
  schedule:
    - cron: '0 21 * * 5'   # Freitag 21:00 UTC, nach Veröffentlichung des COT-Reports
  workflow_dispatch:

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  run-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run COT alert
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python -m cot.main

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/cot.json
          git diff --staged --quiet && exit 0
          git commit -m "chore(data): update COT signals [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push
