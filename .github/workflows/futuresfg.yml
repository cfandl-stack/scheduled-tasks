name: Futures Fear & Greed

on:
  schedule:
    # Täglich 00:20 UTC, nach dem UTC-Tagesschluss
    - cron: '20 0 * * *'
  workflow_dispatch:

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute Futures Fear & Greed
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
        run: python -m futuresfg.main

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/futuresfg.json dashboard/data/futuresfg_raw.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore(data): update futures fear & greed [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push
