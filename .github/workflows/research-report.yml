name: Trading & OpenClaw Research Report

on:
  schedule:
    # Alle 48h — läuft um 06:17 UTC (08:17 MEZ) an ungeraden Tagen
    - cron: '17 6 */2 * *'
  workflow_dispatch: # Manuell auslösbar

jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run research report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/research_report.py

      - name: Create GitHub Issue with report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Research Report $(date +'%d.%m.%Y')"
          gh issue create \
            --title "$TITLE" \
            --body-file report.md \
            --label "report"
