name: Fear & Greed Index

on:
  schedule:
    # Werktags 22:15 UTC, nach US-Börsenschluss
    - cron: '15 22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute Fear & Greed Index
        run: python -m feargreed.main

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/feargreed.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore(data): update fear & greed [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push
